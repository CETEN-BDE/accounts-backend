# Configuration file for oapi-codegen
package: autogen
output: internal/autogen/accounts.gen.go
generate:
  models: true  
  embedded-spec: true
  echo-server: true
  strict-server: true
output-options:
  user-templates:
    constants.tmpl: "./tools/oapi-codegen-templates/enum-values.tmpl"
    imports.tmpl: "./tools/oapi-codegen-templates/imports.tmpl"
compatibility:
  always-prefix-enum-values: true
