openapi: "3.0.3"
info:
  title: OpenAPI - CETEN Accounts
  version: "0.1.0"
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: http://localhost:8080
  - url: https://account.ceten.fr/api
tags:
  - name: oauth
    description: Anything related to OAuth

# Most endpoints are only accessible to authenticated users or third-party
# applications with an oauth token (without a specific field)
security:
  - session: []
  - oauthToken: []

paths:
  /health:
    get:
      security: []  # Publicly accessible
      responses:
        "200":
          description: "API Online"

  # OAuth and OpenID Connect
  /oauth/authorize:
    get:
      summary: Start an OAuth flow
      operationId: startAuthorizationFlow
      description: |
        Start an OAuth flow to request an access token with the specified scopes from a user.
        This will prompt the end user to login if he is not authenticated.
      tags:
        - oauth
      security:
        - session: []  # Only accessible to end users
      parameters:
        - in: query
          name: response_type
          description: |
            Type(s) of oauth response expected, comma-separated. `none` cannot be used with other response types.

            See [specification](https://openid.net/specs/oauth-v2-multiple-response-types-1_0.html#Combinations) for allowed combinations.
          required: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OIDCResponseType"
              minItems: 1
              maxItems: 3
          explode: false
        - in: query
          name: client_id
          required: true
          schema:
            type: integer
            format: uint64
            example: 12345678
        - in: query
          name: redirect_uri
          required: true
          schema:
            type: string
            format: url
            example: "http://localhost:8080/callback"
        - in: query
          name: scope
          required: true
          description: Scopes to request to the end user. MUST include the `openid` scope
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OAuthScope"
            minItems: 1
          example: "openid"
          explode: false
        - in: query
          name: state
          description: |
            Opaque value that will be returned to the redirect URI as a query parameter if present.

            It SHOULD be used to [prevent CSRF attacks](https://datatracker.ietf.org/doc/html/rfc6749#section-10.12)
          schema:
            type: string
        - in: query
          name: nonce
          schema:
            type: string
          description: |
            Opaque value that will be embeded in the `id_token`, to mitigate replay attacks.

            See [OIDC spec](https://openid.net/specs/openid-connect-core-1_0.html#NonceNotes) for more informations
      callbacks:
        success:
          "{$request.query.redirect_uri}":
            get:
              parameters:
                - in: query
                  name: code
                  description: |
                    A code that can be used to retrieve a token.

                    If the response_type was `code`, it is returned in a query parameter.
                    If any of the `id_token` or `token` response_type is used, it is returned in the url fragment.
                  schema:
                    $ref: "#/components/schemas/OAuthAuthorizationCode"
                - in: query
                  name: access_token
                  description: |
                    An access_token that can be used to access the API.

                    Returned in the url fragment if the `token` response_type was requested.
                  schema:
                    type: string
                - in: query
                  name: id_token
                  description: |
                    An id_token following the [OIDC specification](https://openid.net/specs/openid-connect-core-1_0.html#IDToken).

                    Returned in the url fragment if the `id_token` response_type was requested.
                  schema:
                    type: string
                - in: query
                  name: token_type
                  description: |
                    The type of access token returned. Returned in the url fragment if the `token` response_type was requested.

                    The API will only return Bearer tokens.
                  schema:
                    $ref: "#/components/schemas/TokenType"
                - in: query
                  name: expires_in
                  description: |
                    Lifetime in seconds of the access token.

                    Returned in the url fragment if the `token` response_type was requested.
                  schema:
                    type: integer
                    format: uint32
                - in: query
                  name: scope
                  description: |
                    The scope of the access token.

                    Returned in the url fragment if the `token` response_type was requested.
                  schema:
                    type: integer
                    format: uint32
                - in: query
                  name: state
                  description: |
                    REQUIRED if the "state" parameter was present in the client
                    authorization request.  The exact value received from the
                    client.

                    Returned in the fragment component of the redirect uri.
                  schema:
                    type: string
              responses:
                '200':
                  description: The client accepted the callback
        error:
          "{$request.query.redirect_uri}":
            get:
              parameters:
                - in: query
                  name: error
                  description: Returned in the fragment component of the redirect uri.
                  required: true
                  schema:
                    $ref: "#/components/schemas/OAuthAuthorizationErrorCode"
                - in: query
                  name: error_description
                  description: Additional information to assist the client developper. Returned in the fragment component of the redirect uri.
                  schema:
                    type: string
                - in: query
                  name: state
                  description: |
                    REQUIRED if the "state" parameter was present in the client
                    authorization request.  The exact value received from the
                    client. 
                    
                    Returned in the fragment component of the redirect uri.
                  schema:
                    type: string
              responses:
                '200':
                  description: The client accepted the callback
      responses:
        "302":
          description: |
            Redirect to the login page if authentication is required.
            The login page should redirect back to the oauth endpoint after successfull authentication.
        "200":
          description: Displays the OAuth consent page to the end user
  /oauth/token:
    post:
      summary: OAuth token endpoint
      operationId: issueOauthToken
      tags:
        - oauth
      security:
        - oauthClient: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/OAuthAuthorizationCodeTokenRequest"
                - $ref: "#/components/schemas/OAuthClientCredentialTokenRequest"
      responses:
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: "#/components/schemas/OAuthTokenEndpointErrorCode"
                  error_description:
                    type: string
                    description: Human-readable text that provides more information about the error
                required:
                  - error
        "401":
          description: Client authentication failed. Only with `invalid_client` error code
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: "#/components/schemas/OAuthTokenEndpointErrorCode"
                  error_description:
                    type: string
                    description: Human-readable text that provides more information about the error
                required:
                  - error
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    $ref: "#/components/schemas/OAuthAccessToken"
                  token_type:
                    $ref: "#/components/schemas/TokenType"
                  expires_in:
                    type: integer
                    format: uint32
                    description: Lifetime in seconds of the access token
                    example: 3600
                  refresh_token:
                    $ref: "#/components/schemas/OAuthRefreshToken"
                  scope:
                    type: array
                    description: The scope of the access token. REQUIRED if its different from the one requested.
                    items:
                      $ref: "#/components/schemas/OAuthScope"

components:
  schemas:
    # OAuth
    OIDCResponseType:
      description: |
        OpenID Connect `response_type`
      type: string
      enum:
        - none
        - code
        - token
        - id_token
      x-enum-varnames:
        - OIDCNoneResponseType
        - OIDCCodeResponseType
        - OIDCTokenResponseType
        - OIDCIdTokenResponseType
      example: "code"
    OAuthScope:
      type: string
      enum:
        - openid
    OAuthAuthorizationCode:
      description: Authorization code that can be used to retrieve tokens
      type: string
    OAuthAccessToken:
      type: string
    OAuthRefreshToken:
      type: string
    OAuthAuthorizationErrorCode:
      type: string
      description: Authorization endpoint error code as defined in section 4.1.2.1 of [RFC6749](https://datatracker.ietf.org/doc/html/rfc6749#section-4.1.2.1)
      enum:
        - invalid_request
        - unauthorized_client
        - access_denied
        - unsupported_response_type
        - invalid_scope
        - server_error
        - temporarily_unavailable
    OAuthTokenEndpointErrorCode:
      type: string
      description: Token endpoint error code as defined in section 5.2 of [RFC6749](https://datatracker.ietf.org/doc/html/rfc6749#section-5.2)
      enum:
        - invalid_request
        - invalid_client
        - invalid_grant
        - unauthorized_client
        - unsupported_grant_type
        - invalid_scope
    OAuthAuthorizationCodeTokenRequest:
      description: Request an access token with an authorization code ([spec](https://datatracker.ietf.org/doc/html/rfc6749#section-4.1.3))*
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
        code:
          description: The authorization code received from the server
          $ref: "#/components/schemas/OAuthAuthorizationCode"
        redirect_uri:
          type: string
          format: url
          description: The callback URI that was used for the authorization request
          example: "http://localhost:8080/callback"
      required:
        - grant_type
        - code
        - redirect_uri
    OAuthClientCredentialTokenRequest:
      description: Request an access token using client credentials *([spec](https://datatracker.ietf.org/doc/html/rfc6749#section-4.4.2))*
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
        scope:
          type: array
          items:
            $ref: "#/components/schemas/OAuthScope"
      required:
        - grant_type
    OAuthRefreshTokenTokenRequest:
      description: Request an access token using a refresh token *([spec](https://datatracker.ietf.org/doc/html/rfc6749#section-6))*
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - refresh_token
        refresh_token:
          $ref: "#/components/schemas/OAuthRefreshToken"
        scope:
          type: array
          description: Scope of the access request, if different from the original one
          items:
            $ref: "#/components/schemas/OAuthScope"
      required:
        - grant_type
        - refresh_token
    TokenType:
      description: Type of token to use for authentication. Currently, only "Bearer" is supported.
      type: string
      enum:
        - Bearer
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ACCT_SESS
      description: Authenticated end user with Google OAuth or username/password, can complete OAuth flows
    oauthToken:
      type: openIdConnect
      openIdConnectUrl: /.well-known/openid-configuration
      description: OAuth tokens granted to other applications
    oauthClient:
      type: http
      scheme: basic
      description: OAuth Client authentication, as defined in [RFC6749#section-2.3.1](https://datatracker.ietf.org/doc/html/rfc6749#section-2.3.1)
