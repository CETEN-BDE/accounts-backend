# https://taskfile.dev

version: '3'

tasks:
  setup: 
    cmds:
      - go mod download
      - go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
      - go install github.com/fatih/gomodifytags@latest
  regen:
    cmds:
      - oapi-codegen -generate="types,server,strict-server,spec" -package autogen api/accounts.openapi.yml > internal/autogen/accounts.gen.go
      - go mod tidy
      - gomodifytags -all -file internal/autogen/accounts.gen.go -add-tags bson -w > /dev/null