openapi: "3.0.3"
info:
  title: OpenAPI - CETEN Accounts
  version: "0.1.0"
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: http://localhost:8080
  - url: https://account.ceten.fr/api
tags:
  - name: oauth
    description: Anything related to OAuth
  - name: user
    description: Generic info about a user

# Most endpoints are only accessible to authenticated users or third-party
# applications with an oauth token (without a specific field)
security:
  - session: []
  - oauthToken: []

paths:
  /health:
    get:
      security: []  # Publicly accessible
      responses:
        "200":
          description: "API Online"

  # OAuth and OpenID Connect
  /oauth/authorize:
    get:
      summary: Start an OAuth flow
      operationId: startAuthorizationFlow
      description: |
        Start an OAuth flow to request an access token with the specified scopes from a user.
        This will prompt the end user to login if he is not authenticated.
      tags:
        - oauth
      security:
        - session: []  # Only accessible to end users
      parameters:
        - in: query
          name: response_type
          description: |
            Type(s) of oauth response expected, comma-separated. `none` cannot be used with other response types.

            See [specification](https://openid.net/specs/oauth-v2-multiple-response-types-1_0.html#Combinations) for allowed combinations.
          required: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OIDCResponseType"
              minItems: 1
              maxItems: 3
          explode: false
        - in: query
          name: client_id
          required: true
          schema:
            $ref: "#/components/schemas/OAuthClientId"
        - in: query
          name: redirect_uri
          required: true
          schema:
            type: string
            format: uri
            example: "http://localhost:8080/callback"
        - in: query
          name: scope
          required: true
          description: Scopes to request to the end user. MUST include the `openid` scope
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OAuthScope"
            minItems: 1
          example: "openid"
          explode: false
        - in: query
          name: state
          description: |
            Opaque value that will be returned to the redirect URI as a query parameter if present.

            It SHOULD be used to [prevent CSRF attacks](https://datatracker.ietf.org/doc/html/rfc6749#section-10.12)
          schema:
            type: string
        - in: query
          name: nonce
          schema:
            type: string
          description: |
            Opaque value that will be embeded in the `id_token`, to mitigate replay attacks.

            See [OIDC spec](https://openid.net/specs/openid-connect-core-1_0.html#NonceNotes) for more informations
      callbacks:
        success:
          "{$request.query.redirect_uri}":
            get:
              parameters:
                - in: query
                  name: code
                  description: |
                    A code that can be used to retrieve a token.

                    If the response_type was `code`, it is returned in a query parameter.
                    If any of the `id_token` or `token` response_type is used, it is returned in the url fragment.
                  schema:
                    $ref: "#/components/schemas/OAuthAuthorizationCode"
                - in: query
                  name: access_token
                  description: |
                    An access_token that can be used to access the API.

                    Returned in the url fragment if the `token` response_type was requested.
                  schema:
                    type: string
                - in: query
                  name: id_token
                  description: |
                    An id_token following the [OIDC specification](https://openid.net/specs/openid-connect-core-1_0.html#IDToken).

                    Returned in the url fragment if the `id_token` response_type was requested.
                  schema:
                    type: string
                - in: query
                  name: token_type
                  description: |
                    The type of access token returned. Returned in the url fragment if the `token` response_type was requested.

                    The API will only return Bearer tokens.
                  schema:
                    $ref: "#/components/schemas/TokenType"
                - in: query
                  name: expires_in
                  description: |
                    Lifetime in seconds of the access token.

                    Returned in the url fragment if the `token` response_type was requested.
                  schema:
                    type: integer
                    format: uint32
                - in: query
                  name: scope
                  description: |
                    The scope of the access token.

                    Returned in the url fragment if the `token` response_type was requested.
                  schema:
                    type: integer
                    format: uint32
                - in: query
                  name: state
                  description: |
                    REQUIRED if the "state" parameter was present in the client
                    authorization request.  The exact value received from the
                    client.

                    Returned in the fragment component of the redirect uri.
                  schema:
                    type: string
              responses:
                '200':
                  description: The client accepted the callback
        error:
          "{$request.query.redirect_uri}":
            get:
              parameters:
                - in: query
                  name: error
                  description: Returned in the fragment component of the redirect uri.
                  required: true
                  schema:
                    $ref: "#/components/schemas/OAuthAuthorizationErrorCode"
                - in: query
                  name: error_description
                  description: Additional information to assist the client developper. Returned in the fragment component of the redirect uri.
                  schema:
                    type: string
                - in: query
                  name: state
                  description: |
                    REQUIRED if the "state" parameter was present in the client
                    authorization request.  The exact value received from the
                    client. 
                    
                    Returned in the fragment component of the redirect uri.
                  schema:
                    type: string
              responses:
                '200':
                  description: The client accepted the callback
      responses:
        "302":
          description: |
            Redirect to the login page if authentication is required.
            The login page should redirect back to the oauth endpoint after successfull authentication.
        "200":
          description: Displays the OAuth consent page to the end user
  /oauth/token:
    post:
      summary: OAuth token endpoint
      operationId: issueOauthToken
      tags:
        - oauth
      security:
        - oauthClient: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              # TODO: Use discriminator
              oneOf:
                - $ref: "#/components/schemas/OAuthAuthorizationCodeTokenRequest"
                - $ref: "#/components/schemas/OAuthClientCredentialTokenRequest"
      responses:
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: "#/components/schemas/OAuthTokenEndpointErrorCode"
                  error_description:
                    type: string
                    description: Human-readable text that provides more information about the error
                required:
                  - error
        "401":
          description: Client authentication failed. Only with `invalid_client` error code
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: "#/components/schemas/OAuthTokenEndpointErrorCode"
                  error_description:
                    type: string
                    description: Human-readable text that provides more information about the error
                required:
                  - error
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    $ref: "#/components/schemas/OAuthAccessToken"
                  token_type:
                    $ref: "#/components/schemas/TokenType"
                  expires_in:
                    type: integer
                    format: uint32
                    description: Lifetime in seconds of the access token
                    example: 3600
                  refresh_token:
                    $ref: "#/components/schemas/OAuthRefreshToken"
                  scope:
                    type: array
                    description: The scope of the access token. REQUIRED if its different from the one requested.
                    items:
                      $ref: "#/components/schemas/OAuthScope"
  
  # Userinfo endpoint
  /userinfo:
    get:
      summary: Get your own user information
      operationId: getUserinfo
      tags:
        - user
      security:
        - session: []
        - oauthToken: [openid]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCUserInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      summary: Change user information
      description: Allows an end-user to change its information. Not accessible with oauth
      operationId: patchUserInfo
      tags:
        - user
      security:
        - session: []
      responses:
        "204":
          description: Success
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "invalid_token"
            message: "Expired access token"
            error_description: "Your access token expired, please login again"
    Forbidden:
      description: The user does not have access to this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "insufficient_permission"
            message: "Missing MANAGE_CLUBS permission"
            error_description: "You don't have the permission to do that"

  schemas:

    ErrorCode:
      description: |
        Error codes

        | Code | Description |
        |------|-------------|
        | `internal_error` | Internal server error |
        | `invalid_request` | Invalid request, missing or invalid parameters |
        | `invalid_token` | Malformed, expired or revoked token |
        | `insufficient_scope` | The required scope was not granted to the used token |
        | `insufficient_permission` | The user does not have the permission to use this endpoint |
      type: string
      enum:
        - internal_error
        - invalid_request
        - invalid_token
        - insufficient_scope
        - insufficient_permission

    Error:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        error_description:
          description: Description that can be displayed to the user
          type: string
      required:
        - code
        - message
    
    ###########
    #  OAuth  #
    ###########
    OIDCResponseType:
      description: |
        OpenID Connect `response_type`
      type: string
      enum:
        - none
        - code
        - token
        - id_token
      x-enum-varnames:
        - OIDCNoneResponseType
        - OIDCCodeResponseType
        - OIDCTokenResponseType
        - OIDCIdTokenResponseType
      example: "code"
    OAuthAuthorizationCode:
      description: Authorization code that can be used to retrieve tokens
      type: string
    OAuthAccessToken:
      type: string
    OAuthRefreshToken:
      type: string
    OAuthAuthorizationErrorCode:
      type: string
      description: Authorization endpoint error code as defined in section 4.1.2.1 of [RFC6749](https://datatracker.ietf.org/doc/html/rfc6749#section-4.1.2.1)
      enum:
        - invalid_request
        - unauthorized_client
        - access_denied
        - unsupported_response_type
        - invalid_scope
        - server_error
        - temporarily_unavailable
    OAuthTokenEndpointErrorCode:
      type: string
      description: Token endpoint error code as defined in section 5.2 of [RFC6749](https://datatracker.ietf.org/doc/html/rfc6749#section-5.2)
      enum:
        - invalid_request
        - invalid_client
        - invalid_grant
        - unauthorized_client
        - unsupported_grant_type
        - invalid_scope
    OAuthAuthorizationCodeTokenRequest:
      description: Request an access token with an authorization code ([spec](https://datatracker.ietf.org/doc/html/rfc6749#section-4.1.3))*
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
        code:
          description: The authorization code received from the server
          $ref: "#/components/schemas/OAuthAuthorizationCode"
        redirect_uri:
          type: string
          format: uri
          description: The callback URI that was used for the authorization request
          example: "http://localhost:8080/callback"
      required:
        - grant_type
        - code
        - redirect_uri
    OAuthClientCredentialTokenRequest:
      description: Request an access token using client credentials *([spec](https://datatracker.ietf.org/doc/html/rfc6749#section-4.4.2))*
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
        scope:
          type: array
          items:
            $ref: "#/components/schemas/OAuthScope"
      required:
        - grant_type
    OAuthRefreshTokenTokenRequest:
      description: Request an access token using a refresh token *([spec](https://datatracker.ietf.org/doc/html/rfc6749#section-6))*
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - refresh_token
        refresh_token:
          $ref: "#/components/schemas/OAuthRefreshToken"
        scope:
          type: array
          description: Scope of the access request, if different from the original one
          items:
            $ref: "#/components/schemas/OAuthScope"
      required:
        - grant_type
        - refresh_token
    OAuthClientId:
      type: integer
      format: uint64
      example: 123456
    TokenType:
      description: Type of token to use for authentication. Currently, only "Bearer" is supported.
      type: string
      enum:
        - Bearer
    OIDCIdToken:
      description: ID Token as defined in the [OIDC spec](https://openid.net/specs/openid-connect-core-1_0.html#IDToken)
      type: object
      properties:
        iss:
          description: Issuer Identifier for the Issuer of the response
          type: string
          format: uri
          example: "https://account.ceten.fr/"
        sub:
          description: Subject Identifier. A locally unique and never reassigned identifier for the End-User, which is intended to be consumed by the Client.
          type: string
          maxLength: 255
        aud:
          $ref: "#/components/schemas/OAuthClientId"
          description: Audience(s) that this ID Token is intended for
        exp:
          description: Expiration time (timestamp) on or after which the ID Token MUST NOT be accepted
          type: integer
          format: timestamp
          example: 1056391200
        iat:
          description: Time (timestamp) at which the ID token was issued
          type: integer
          format: timestamp
          example: 1056391200
        auth_time:
          description: Time when the End-User authentication occurred
          type: integer
          format: timestamp
          example: 1056391200
        nonce:
          description: The value is passed through unmodified from the Authentication Request to the ID Token. REQUIRED if a `nonce` was passed in the authentication request
          type: string
        claims:
          $ref: "#/components/schemas/OIDCUserInfo"
    OIDCUserInfo:
      type: object
      description: Provides information about an end user.
      properties:
        sub:
          description: Subject Identifier. A locally unique and never reassigned identifier for the End-User, which is intended to be consumed by the Client.
          type: string
          maxLength: 255
        name:
          type: string
          description: End-User's full name in displayable form, including all name parts
        given_name:
          type: string
          description: First name of the End-User
        family_name:
          type: string
          description: Last name of the End-User
        nickname:
          type: string
          description: Casual name of the End-User. Same as `given_name` if not specified.
        picture:
          type: string
          format: uri
          description: URL of the End-User's profile picture.
        email:
          type: string
          format: email
          description: End-User's e-mail address.
        email_verified:
          type: boolean
          description: |
            True if the End-User's e-mail address has been verified; otherwise false. 

            Here, an e-mail address is verified if it was registered via google oauth or manually verified by an administrator.
        birthdate:
          type: string
          description: End-User's birthday, represented as an ISO 8601-1 YYYY-MM-DD format. The year MAY be 0000, indicating that it is omitted.
        phone_number:
          type: string
          description: End-User's preferred telephone number.
          example: "(+33) 6 12 34 56 78"
        phone_number_verified:
          type: boolean
          description: True if the End-User's phone number has been verified; otherwise false. 
        updated_at:
          type: integer
          format: timestamp
          description: Time the End-User's information was last updated. (timestamp)
          example: 1056391200
        address:
          $ref: "#/components/schemas/OIDCAddress"
    OIDCAddress:
      type: object
      description: Address claim, as defined in the [OIDC spec](https://openid.net/specs/openid-connect-core-1_0.html#AddressClaim)
      properties:
        formatted:
          type: string
          description: Full mailing address, formatted for display or use on a mailing label. This field MAY contain multiple lines, separated by newlines. Newlines can be represented either as a carriage return/line feed pair ("\r\n") or as a single line feed character ("\n"). 
        street_address:
          type: string
          description: Full street address component, which MAY include house number, street name, Post Office Box, and multi-line extended street address information. This field MAY contain multiple lines, separated by newlines. Newlines can be represented either as a carriage return/line feed pair ("\r\n") or as a single line feed character ("\n"). 
        locality:
          type: string
          description: City or locality component. 
        region:
          type: string
          description: State, province, prefecture, or region component. 
        postal_code:
          type: integer
          description: Zip code or postal code component. 
        country:
          type: string
          description: Country name component. 

    OAuthScope:
      type: string
      description: |
        Describes the scopes that can be granted using OAuth.
        
        Most scopes are read-only by default, and can be appended with `:write` to get write pemission,
        `:admin_read` to get admin read permission (e.g. read others private information), or `:admin_write`
        to get admin write permission (e.g. edit other user's information).

        Scopes appended with `:admin_read` or `:admin_write` are usually linked to administrative permissions,
        and will likely require reauthentication of the end-user, and that the end-user uses advanced authentication
        features such as 2FA. If the end-user does not have access to the associatd permission, the scope will
        be ignored for the Authentication Request, and will not be shown in the consent screen.

        Scopes related to club management permissions (e.g. `club_members:write`) will be shown in the consent
        screen even if the end user does not currently have such permissions. This avoids the need for the client
        to renew its authorization request if the user was to gain or loose such privileges in the future
        (e.g. registering to a club management application before being assigned the club roles). Note that club
        management permissions are checked every time a management request is made, and the server does not take
        that the presence of the scopes in the access token for a proof tht the end user has the permissions, applications
        need to handle 403 Forbidden errors on these endpoints accordingly.
      enum:
        # OIDC defined scopes
        - openid
        - profile
        - email
        - address
        - phone

        # OIDC scopes extension
        - userinfo:admin_read   # read any user information
        - userinfo:admin_write  # read and write any user information

        # Clubs
        - clubs  # See which clubs you are in

        - club_members  # See all members of your clubs
        - club_members:write  # Manage members (and their roles) of your club
        - club_members:admin_read  # See all members of any club
        - club_members:admin_write  # Manage all members of any club
        - club_roles:write  # Manage clubs custom roles
        - club_roles:admin_write  # Manage any clubs custom roles
        - clubs:admin_write  # Manage all clubs. Allow creating and deleting clubs, as well as all club_*:admin_write scopes

    ###################
    #  Authorization  #
    ###################
    GlobalPermission:
      type: string
      description: |
        A global permission that is not club-specific. Mostly admin permissions, that will need
        reauthentication and 2FA to be granted to oauth clients.
      enum:
        - ADMIN  # Grants every permissions and skips authorization checks
        - MANAGE_CLUBS  # Manage all club-related information (creation, members, BR, roles ...)
        - MANAGE_USERS_INFO  # Manage user informations
        - MANAGE_USERS_ROLES  # Manage user roles assignments
        - MANAGE_ROLES  # Manage roles and their permissions
    ClubPermission:
      type: string
      description: |
        A club-specific permission. Mostly club management permission, that can be granted to a user for a specific club.
      enum:
        - MANAGE_MEMBERS  # Manage club members and their roles (except BR)
        - MANAGE_ROLES  # Manage club custom roles
        - MANAGE_PROFILE  # Manage club profile
    Role:
      description: Global role that can be used to group permissions
      type: object
      properties:
        id:
          type: integer
          format: uint64
          readOnly: true
        name:
          type: string
        default_role:
          description: True if the role is a default role that cannot be modified.
          type: boolean
          default: false
          readOnly: true
        permissions:
          description: List of global permissions granted by this role
          type: array
          items:
            $ref: "#/components/schemas/GlobalPermission"
    ClubRole:
      description: Club-specific role that can be used to group club permissions
      type: object
      properties:
        id:
          type: integer
          format: uint64
          readOnly: true
        name:
          type: string
        default_role:
          description: True if the role is a default club role that cannot be modified.
          type: boolean
          default: false
          readOnly: true
        permissions:
          description: List of club permissions granted by this role
          type: array
          items:
            $ref: "#/components/schemas/ClubPermission"
    CustomClubRole:
      description: Custom club-specific role that can be created by club members with the `MANAGE_ROLES` permission
      type: object
      properties:
        id:
          type: integer
          format: uint64
          readOnly: true
        name:
          type: string
        public:
          type: boolean
          description: |
            Specify if club members with this role should be displayed on the public club information page,
            along with the BR and BE.
          default: true
        permissions:
          description: List of club permissions granted by this role
          type: array
          items:
            $ref: "#/components/schemas/ClubPermission"

    NameAndId:
      description: Summary of an entity with a name and an id
      type: object
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
      required:
        - id
        - name

    ###########
    #  Users  #
    ###########
    UserSummary:
      description: Summary of a user, with limited information
      type: object
      properties:
        id:
          type: integer
          format: uint64
          readOnly: true
        name:
          type: string
          description: Display name of the user
        given_name:
          type: string
          description: First name of the user
        family_name:
          type: string
          description: Last name of the user
        nickname:
          type: string
          description: Casual name of the user.
        picture:
          type: string
          format: uri
          description: URL of the user's profile picture.
      required:
        - id
        - name
        - given_name
        - family_name
        
    ###########
    #  Clubs  #
    ###########
    ClubType:
      description: The type of club
      type: string
      enum:
        - event
        - hobby
        - services
    Club:
      type: object
      properties:
        id:
          type: integer
          format: uint64
          readOnly: true
        name:
          type: string
        type:
          $ref: "#/components/schemas/ClubType"
        description:
          type: string
          maxLength: 60000
        mail:
          type: string
          format: email
        president:
          description: The club's president
          allOf:
            - $ref: "#/components/schemas/UserSummary"
        treasurer:
          description: The club's treasurer
          allOf:
            - $ref: "#/components/schemas/UserSummary"
        secretary:
          description: The club's secretary
          allOf:
            - $ref: "#/components/schemas/UserSummary"
    ClubMembership:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          properties:
            since:
              description: Start date of the membership
              type: string
              format: datetime
            until:
              description: End date of the membership. Not present when not specified and the membership is still valid
              type: string
              format: datetime
            role:
              description: Club role assigned to the user
              allOf:
                - $ref: "#/components/schemas/NameAndId"
            custom_roles:
              description: Custom club roles assigned to the user
              type: array
              items:
                $ref: "#/components/schemas/NameAndId"
          required:
            - role
            - custom_roles
            - since

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ACCT_SESS
      description: Authenticated end user with Google OAuth or username/password, can complete OAuth flows
    oauthToken:
      type: openIdConnect
      openIdConnectUrl: /.well-known/openid-configuration
      description: OAuth tokens granted to other applications
    oauthClient:
      type: http
      scheme: basic
      description: OAuth Client authentication, as defined in [RFC6749#section-2.3.1](https://datatracker.ietf.org/doc/html/rfc6749#section-2.3.1)
